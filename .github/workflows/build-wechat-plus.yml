name: Build MARU WeChat Plus 0.5 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wechat-plus/**'
      - '.github/workflows/build-wechat-plus.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35 is installed
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile standalone MARU WeChat Plus APK
        working-directory: wechat-plus
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload directly installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MARU-WeChat-Plus-V0.5-APK
          path: wechat-plus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
