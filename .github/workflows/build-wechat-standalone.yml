name: Build MARU WeChat Standalone APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wechat-archive/**'
      - '.github/workflows/build-wechat-standalone.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMGR=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "sdkmanager: ${SDKMGR}"
          test -n "${SDKMGR}"
          "${SDKMGR}" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Recover and verify standalone app source
        run: |
          cat wechat-archive/part*.b64 | base64 --decode > source.tar.gz
          echo "ffcc9b629d9a825b94dfcbcb65c43c7c98daf9cbbd64edb700de61baf03fdf76  source.tar.gz" | sha256sum --check
          tar -xzf source.tar.gz
      - name: Compile independent MARU WeChat APK
        working-directory: WeChat_Voice_Translator_Test
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MARU-WeChat-Translator-APK
          path: WeChat_Voice_Translator_Test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
