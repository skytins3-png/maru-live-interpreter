plugins { id 'com.android.application' }

android {
    namespace 'com.maru.liveinterpreter'
    compileSdk 36
    defaultConfig {
        applicationId 'com.maru.liveinterpreter'
        minSdk 26
        targetSdk 36
        versionCode 41
        versionName '0.4.1-wechat-clarity-test'
    }
    buildTypes {
        debug { applicationIdSuffix '.wechattest' }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
