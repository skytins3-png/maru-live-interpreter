plugins { id 'com.android.application' }
android {
    namespace 'com.maru.wechattranslator'
    compileSdk 35
    defaultConfig {
        applicationId 'com.maru.wechattranslator'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
}
